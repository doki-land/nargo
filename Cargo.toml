[workspace]
resolver = "3"
members = [
    "compilers/*",
    "examples/nargo-basic",
    "examples/nargo-document-example",
    "examples/nargo-sdk-example",
    "examples/nargo-plugin-example",
]
default-members = [
    "compilers/*"
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Nargo Team"]
homepage = "https://github.com/doki-land/nargo"
repository = "https://github.com/doki-land/nargo"
license = "MIT"

[workspace.dependencies]

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.50.0", features = ["full"] }
walkdir = "2.5.0"
num_cpus = "1.17"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
dialoguer = "0.12.0"
color-eyre = "0.6.5"
console = "0.16.3"
chrono = "0.4.44"
dashmap = "6.1.0"
rayon = "1.11.0"
sha2 = "0.10.9"
hex = "0.4.3"
ignore = "0.4.25"
async-trait = "0.1.89"
futures = "0.3.32"
tower-lsp = "0.20.0"
tempfile = "3.27.0"
indicatif = "0.18.4"
mime_guess = "2.0.5"
gix = { version = "0.80.0", features = ["blocking-network-client"] }
semver = "1.0.27"
tokio-util = "0.7.18"
petgraph = "0.8.3"
flate2 = "1.1.9"
tar = "0.4.45"
base64 = "0.22.1"
url = "2.5.8"
dirs = "6.0.0"
regex = "1.12.3"
ws = "0.9.2"
warp = { version = "0.4.2", features = ["server"] }
sha1 = "0.10.6"
itertools = "0.14.0"
once_cell = "1.21.4"
triomphe = "0.1.15"
filetime = "0.2.27"
notify = "8.2.0"
glob = "0.3.3"
mime = "0.3.17"
lazy_static = "1.5.0"

serde = "1.0.200"
serde_json = "1.0.117"

# Nargo packages
nargo-types = { path = "compilers/nargo-types", version = "0.0.1" }
nargo-config = { path = "compilers/nargo-config", version = "0.0.1" }
nargo-parser = { path = "compilers/nargo-parser", version = "0.0.1" }
nargo-compiler = { path = "compilers/nargo-compiler", version = "0.0.1" }
nargo-bundler = { path = "compilers/nargo-bundler", version = "0.0.1" }
nargo-server = { path = "compilers/nargo-server", version = "0.0.1" }
nargo-linter = { path = "compilers/nargo-linter", version = "0.0.1" }
nargo-formatter = { path = "compilers/nargo-formatter", version = "0.0.1" }
nargo-coverage = { path = "compilers/nargo-coverage", version = "0.0.1" }
nargo-audit = { path = "compilers/nargo-audit", version = "0.0.1" }
nargo-hooks = { path = "compilers/nargo-hooks", version = "0.0.1" }
nargo-bridge = { path = "compilers/nargo-bridge", version = "0.0.1" }
nargo-release = { path = "compilers/nargo-release", version = "0.0.1" }
nargo-scaffolder = { path = "compilers/nargo-scaffolder", version = "0.0.1" }
nargo-template = { path = "compilers/nargo-template", version = "0.0.1" }
nargo-plugin = { path = "compilers/nargo-plugin", version = "0.0.1" }
nargo-report = { path = "compilers/nargo-report", version = "0.0.1" }
nargo-lsp = { path = "compilers/nargo-lsp", version = "0.0.1" }
nargo-registry = { path = "compilers/nargo-registry", version = "0.0.1" }
nargo-resolver = { path = "compilers/nargo-resolver", version = "0.0.1" }
nargo-cache = { path = "compilers/nargo-cache", version = "0.0.1" }
nargo-lock = { path = "compilers/nargo-lock", version = "0.0.1" }
nargo-workspace = { path = "compilers/nargo-workspace", version = "0.0.1" }
nargo-git = { path = "compilers/nargo-git", version = "0.0.1" }
nargo-optimizer = { path = "compilers/nargo-optimizer", version = "0.0.1" }
nargo-transformer = { path = "compilers/nargo-transformer", version = "0.0.1" }
nargo-style-processor = { path = "compilers/nargo-style-processor", version = "0.0.1" }
nargo-script-analyzer = { path = "compilers/nargo-script-analyzer", version = "0.0.1" }
nargo-hydrate = { path = "compilers/nargo-hydrate", version = "0.0.1" }
nargo-ssr = { path = "compilers/nargo-ssr", version = "0.0.1" }
nargo-mcp = { path = "compilers/nargo-mcp", version = "0.0.1" }
nargo-changes = { path = "compilers/nargo-changes", version = "0.0.1" }
nargo-document = { path = "compilers/nargo-document", version = "0.0.1" }
nargo-ir = { path = "compilers/nargo-ir", version = "0.0.1" }
nargo-type-check = { path = "compilers/nargo-type-check", version = "0.0.1" }
nargo-metadata = { path = "compilers/nargo-metadata", version = "0.0.1" }
nargo-sdk = { path = "compilers/nargo-sdk", version = "0.0.1" }

# Oak parsers
oak-core = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-lsp = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-vfs = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-vue = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-json = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-toml = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-markdown = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-tailwind = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-typescript = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-css = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-sass = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-scss = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-yaml = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-jinja = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-liquid = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-dejavu = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-source-map = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-stylus = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-handlebars = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.12" }
oak-ejs = { path = "../oaks/examples/oak-ejs" }

# WAE services
wae-server = { git = "https://github.com/oovm/wae", branch = "dev", version = "0.0.2" }
wae-request = { git = "https://github.com/oovm/wae", branch = "dev", version = "0.0.2" }

[workspace.dev-dependencies]
# Benchmarking
criterion = "0.5.1"

# Force using ring instead of aws-lc-rs
ring = "0.17.8"

# Force rustls and rustls-webpki to use ring instead of aws-lc-rs
rustls = { version = "0.21.7", features = [], default-features = false }
rustls-webpki = { version = "0.0.1", features = [], default-features = false }

[patch."https://github.com/ygg-lang/oaks.git"]
oak-dejavu = { path = "../oaks/examples/oak-dejavu" }

